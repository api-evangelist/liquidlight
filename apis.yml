name: LiquidLight
description: 'LiquidLight, Inc. (Liquid Light) was an electrochemistry company based in Monmouth
  Junction, New Jersey that developed and licensed process technology for converting carbon dioxide
  into industrial chemicals. Founded in 2009 by Kyle Teamey, Emily Cole, Andrew Bocarsly, Fouad
  Elnaggar and Nety Krishna around technology licensed from Princeton University, the company built a
  portfolio of more than 100 patents covering the electrochemical production of chemicals including
  monoethylene glycol (MEG), propylene and acetic acid, with MEG as its lead target market. It raised
  seed funding from Redpoint Ventures and a $15 million Series B in September 2014 from investors
  including VantagePoint Capital Partners and BP Ventures, and was also a Battery Ventures portfolio
  investment. Avantium acquired Liquid Light on January 10, 2017 and the company ceased operating
  independently. LiquidLight was a materials and process-technology company: it never published a
  public API, developer portal, SDKs or any machine-readable developer surface, and no company web
  property survives the acquisition. This profile is retained in the API Evangelist network as an
  accurate, non-API portfolio record.'
